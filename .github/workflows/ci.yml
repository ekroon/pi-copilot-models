name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
        pi: ["1.3.0"]
        include:
          - node: 22
            pi: "0.84.4"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Install minimum supported Pi for compatibility testing
        if: matrix.pi == '0.84.4'
        run: npm install --no-save --package-lock=false @earendil-works/pi-ai@0.84.4 @earendil-works/pi-coding-agent@0.84.4
      - run: npm run check
      - run: npm run check:package
      - name: Audit release development dependencies
        if: matrix.pi == '1.3.0'
        run: npm audit --audit-level=moderate
